{% extends "base.html" %}
{% block content %}
<main id="main-content" class="min-h-screen flex flex-col justify-center py-10 px-4 sm:px-6 bg-[#F6F8FA]">
  <section aria-labelledby="reset-heading" class="max-w-md w-full mx-auto bg-white rounded-2xl border border-slate-200 p-7 casagbi-shadow-card space-y-5">
    <div class="flex items-center justify-between gap-2">
      <div>
        <p class="text-[11px] font-bold uppercase tracking-wider text-[#006837]">Seguridad de Cuenta UPC</p>
        <h1 id="reset-heading" class="text-xl font-bold text-slate-900 mt-0.5">Restablecer contraseña</h1>
      </div>
      <a href="/login" class="text-xs font-semibold text-slate-700 hover:text-[#006837]">Ir al login</a>
    </div>

    <div id="reset-status-banner" role="alert" aria-live="polite" class="hidden rounded-xl border px-3.5 py-2.5 text-xs"></div>

    <form id="reset-confirm-form" class="space-y-4">
      <div>
        <label for="reset-token" class="block text-xs font-semibold text-slate-800 mb-1">Token de recuperación</label>
        <input id="reset-token" type="text" required value="{{ reset_token or '' }}" placeholder="Pega tu token temporal" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs font-mono focus:outline-none focus:border-[#006837]" />
      </div>
      <div>
        <label for="reset-new-password" class="block text-xs font-semibold text-slate-800 mb-1">Nueva contraseña (mín. 8 caracteres)</label>
        <input id="reset-new-password" type="password" required minlength="8" autocomplete="new-password" placeholder="Nueva contraseña segura" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#006837]" />
      </div>
      <div>
        <label for="reset-confirm-password" class="block text-xs font-semibold text-slate-800 mb-1">Confirmar nueva contraseña</label>
        <input id="reset-confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="Repite la contraseña" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#006837]" />
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-[#006837] hover:bg-[#004d28] text-white text-sm font-semibold cursor-pointer transition">
        Actualizar contraseña
      </button>
    </form>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var params = new URLSearchParams(window.location.search);
  var tokenEl = document.getElementById("reset-token");
  var banner = document.getElementById("reset-status-banner");
  if (params.get("token")) tokenEl.value = params.get("token");

  function showBanner(msg, ok) {
    banner.textContent = msg;
    banner.className = "rounded-xl border px-3.5 py-2.5 text-xs " + (ok ? "border-emerald-300 bg-emerald-50 text-emerald-950" : "border-red-300 bg-red-50 text-red-900");
    banner.classList.remove("hidden");
  }

  document.getElementById("reset-confirm-form")?.addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = document.getElementById("reset-new-password").value;
    var cf = document.getElementById("reset-confirm-password").value;
    if (pw !== cf) { showBanner("Las contraseñas no coinciden.", false); return; }
    try {
      var res = await window.CasagbiApi.post("/api/v1/auth/password-reset/confirm", { token: tokenEl.value.trim(), new_password: pw });
      showBanner(res.message || "Contraseña restablecida correctamente.", true);
      setTimeout(function () { window.location.href = "/login"; }, 1400);
    } catch (err) {
      showBanner(err.message || "Token inválido o expirado.", false);
    }
  });
});
</script>
{% endblock %}
