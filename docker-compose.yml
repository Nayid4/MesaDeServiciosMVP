services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casagbi-mesa-servicios-upc
    ports:
      - "8000:8000"
    environment:
      - CASAGBI_DB_PATH=/app/data/mesa_servicios_upc.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casagbi-jupyter-eda
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    command: sh -c "python -m src.bootstrap && jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
    restart: unless-stopped
